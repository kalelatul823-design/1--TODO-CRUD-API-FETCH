<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO CRUD API FETCH</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row mt-5">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <form id="todoForm">
                <div class="form-group">
                  <label for="todoItem">TODO</label>
                  <input type="text" class="form-control" id="todoItem" />
                </div>
                <button type="submit" class="btn btn-primary btn-sm btn-block" id="submitBtn">
                  Add Todo
                </button>
                <button type="button" class="btn btn-dark btn-sm btn-block d-none" id="updateBtn">
                  Update Todo
                </button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-md-6">
            <ul class="list-group" id="list">
                <!-- <li class="list-group-item d-flex justify-content-between">
                    <strong>HTML</strong>
                    <div>
                        <i class="fa-solid fa-pen-to-square fa-2x text-primary"></i>
                        <i class="fa-solid fa-trash fa-2x text-danger"></i>
                    </div>
                </li> -->
            </ul>
        </div>
      </div>
    </div>

    <div class="spinner d-none" id="spinner">
      <div class="spinner-border text-success" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
